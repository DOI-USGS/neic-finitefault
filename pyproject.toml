[build-system]
requires = ["setuptools >= 72.2.0"]
build-backend = "setuptools.build_meta"

[tool.isort]
profile = "black"

[project]
authors = [
  {name = "Pablo Koch",  email = "pkoch@csn.uchile.cl"}, 
  {name = "Dara Goldberg", email = "degoldberg@usgs.gov"},
  {name = "Heather Hunsinger", email = "hhunsinger@usgs.gov"},
  {name = "Diego Melgar", email = "dmelgarm@uoregon.edu"},
  {name = "Sebastian Riquelme", email = "sebastian@dgf.uchile.cl"},
  {name = "William Yeck", email = "wyeck@usgs.gov"},
  {name = "Kirstie Haynie", email = "khaynie@usgs.gov"}
]
maintainers = [
  {name = "Dara Goldberg", email = "degoldberg@usgs.gov"},
]
description = "Wavelet based inversion for slip on a fault, used to generate Finite Fault products"
keywords = ["usgs", "neic", "earthquake", "slip", "finitefault"]
name = "neic-finitefault"
requires-python = ">=3.10"
version = "1.3.0"

[project.urls]
Repository = "https://code.usgs.gov/ghsc/neic/algorithms/neic-finitefault"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
"ffm" = "ffm.ffm_admin.ffm:app"

[tool.poe.tasks]
audit = [
  # TODO: remove after upgrading python version and removal of fiona
  { shell = "pip-audit --ignore-vuln GHSA-chx6-46f5-w4vp --ignore-vuln GHSA-c2m8-h5v5-343r --ignore-vuln GHSA-3hv7-mjh2-fv65 --ignore-vuln  CVE-2026-97687 --ignore-vuln CVE-2026-97688 --ignore-vuln CVE-2026-97689" }
]
fix = [
  { shell = "black src" },
  { shell = "isort src/ffm" }
]
lint = [
  { shell = "black --check src" },
  { shell = "isort --check src/ffm" },
  { shell = "mypy src/ffm" }
]
test = [
  { shell = "pytest src/test --cov=src/ffm" },
  { shell = "coverage xml" },
  { shell = "coverage html" }
]
end_to_end_test = [
  { shell = "pytest src/test --cov=src/ffm" },
  { shell = "black --check src" },
  { shell = "isort --check src/ffm" },
  { shell = "mypy src/ffm" }
]



