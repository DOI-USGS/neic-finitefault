---
default:
  before_script:
    # install and cache python
    - |
      if [ -d "miniforge" ]; then
          . ./miniforge/etc/profile.d/conda.sh;
      else
          curl -L "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-$(uname)-$(uname -m).sh" -o ./miniforge.sh;
          bash ./miniforge.sh -fbp "$(pwd)/miniforge";
          rm -r miniforge.sh;
      fi
    # make conda accessible
    - . "$(pwd)/miniforge/etc/profile.d/conda.sh"
    - export PATH="$(pwd)/miniforge/bin:$PATH"
    - |
      if [ -d "$(pwd)/miniforge/envs/ff-env" ]; then
          conda activate ff-env;
      else
          source install.d/ff-env.sh "$(pwd)";
          conda activate ff-env;
      fi
    - apt install -y gfortran
    # make clawpack installation
    - source install.d/clawpack.sh "$(pwd)" -y;
  cache:
    key:
      files:
        - install.d/environment.yml
    paths:
      - miniforge
      - fortran_code/gfs_nm/long/fd_bank
      - fortran_code/info/LITHO1.0.nc
      - clawpack
  image: code.usgs.gov:5001/devops/images/usgs/python:3.10-build
  tags:
    - dev
    - developers

variables:
  UPSTREAM_PATH: ghsc/neic/algorithms/neic-finitefault
  RUN_ALL: "false"
  RUNNER: "true"

# Do not run for merge requests
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - init
  - audit
  - lint
  - dependencies
  - test

.fork: &fork
  if: $CI_PROJECT_PATH != '$UPSTREAM_PATH'
  variables:
    RUN_ALL: "true"
    RUNNER: "false"
    RUN_END_TO_END: "true"

## -------------------------------------
#  Init Stage
## -------------------------------------

Fortran Install:
  before_script: ""
  cache: []
  artifacts:
    expire_in: 1 week
    paths:
      - fortran_code
  script:
    - apt install gfortran make gcc -y
    - bash install.d/ffm.sh "$(pwd)"
  stage: init

Python Install:
  script:
    - echo "Install and cache"
  stage: init

## -------------------------------------
#  Audit Stage
## -------------------------------------

Python Audit:
  # remove when python version update MR is merged
  allow_failure: true
  needs:
    - Python Install
  script:
    - pip install pip-audit poethepoet
    - poe audit
  stage: audit

## -------------------------------------
#  Lint Stage
## -------------------------------------

Python Lint:
  needs:
    - Python Install
  script:
    - poe lint
  stage: lint

## -------------------------------------
#  Dependencies Stage
## -------------------------------------

Data Dependencies:
  allow_failure: true
  artifacts:
    paths:
      - fortran_code/gfs_nm/long/fd_bank
      - fortran_code/info/LITHO1.0.nc
    expire_in: 1 day
  needs:
    - Python Install
  script:
    - bash install.d/data_dependencies.sh "$(pwd)"
  stage: dependencies

## -------------------------------------
#  Test Stage
## -------------------------------------

Python Test:
  script:
    - apt install gfortran -y
    - pip install .
    - export CLAW=$(pwd)/clawpack
    - export PYTHONPATH=$CLAW:$PYTHONPATH
    - export FC=gfortran
    - poe test
  stage: test

Full End to End Test:
  rules:
    - <<: *fork
      when: manual
  script:
    - apt install gfortran -y
    - pip install .
    - poe test
  stage: test
  tags:
    - beast
